[package]
name = "palimpsest-mcp"
version = "0.1.0"
edition = "2021"
description = "Persistent memory MCP server: hybrid semantic+lexical retrieval over SQLite with supersession-based history"
license = "MIT"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
