[package]
name = "palimpsest-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Persistent memory MCP server: hybrid semantic+lexical+entity retrieval over SQLite, append-only supersession history with time-travel, knowledge graph, and a living STATE.md per project"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jdiestramelendez/palimpsest-mcp"
homepage = "https://github.com/jdiestramelendez/palimpsest-mcp"
keywords = ["mcp", "memory", "ai", "agent", "sqlite"]
categories = ["command-line-utilities", "database"]
exclude = ["tickets/", "evals/", ".github/", "plugin/", ".claude-plugin/", "docs/", "examples/", "tests/"]

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
