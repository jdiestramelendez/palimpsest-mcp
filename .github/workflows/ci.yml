name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Retrieval eval (deterministic floors)
        run: cargo run --bin eval -- --check
      - name: Invariant audit (append-only memories)
        run: |
          ! grep -rn "DELETE FROM" src/
          test "$(grep -rn 'UPDATE memories' src/ | wc -l)" -le 2
